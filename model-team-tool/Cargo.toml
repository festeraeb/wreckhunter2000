[package]
name = "model-team-tool"
version = "0.1.0"
edition = "2021"
description = "Standalone reasoning+coding model team orchestrator"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nvml-wrapper = "0.12"
wgpu = "29.0"
pollster = "0.4"
hostname = "0.3"
uuid = { version = "1.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
