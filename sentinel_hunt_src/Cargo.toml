[package]
name = "sentinel-hunt"
version = "0.1.0"
edition = "2021"
description = "Great Lakes wreck detection via Sentinel-1 SAR & Sentinel-2 optical satellite imagery"
authors = ["WH2K Team"]

[[bin]]
name = "sentinel-hunt"
path = "src/main.rs"

[lib]
name = "sentinel_hunt"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
geo = "0.29"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
tempfile = "3"
zip = "2"
quick-xml = "0.37"
once_cell = "1"
urlencoding = "2"
